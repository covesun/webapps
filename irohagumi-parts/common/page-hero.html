<!--
  パーツ名: page-hero（見出し帯）
  用途: 下層ページ上部の「ページタイトル帯」。Company/Business/Works/Contactの4ページで使用。
  元コンポーネント: src/app/components/PageHero.tsx
  注意: これは"1個のパーツを使い回す"のではなく、ページごとに img（背景画像）と ja（見出し文言）が
        異なるので、各ページのHTMLに以下の型でそれぞれ1個ずつ配置してください（＝パーツとしては
        ページ数分＝4個になります）。下記は例として4ページ分のバリエーションをまとめて記載しています。
  依存CSS: common/irohagumi.css
-->

<!-- [Company] img=images/ph_company.jpg  ja="会社概要"  objectPosition: center 72% -->
<section class="relative h-64 md:h-80 flex items-end overflow-hidden bg-zinc-100">
  <img src="images/ph_company.jpg" alt="会社概要" class="absolute inset-0 w-full h-full object-cover" style="object-position:center 72%" />
  <div class="absolute inset-x-0 bottom-0 h-40 bg-gradient-to-t from-white/95 via-white/50 to-transparent"></div>
  <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-yellow-400"></div>
  <div class="relative z-10 max-w-7xl mx-auto px-6 w-full pb-10 md:pb-14">
    <h1 class="text-4xl md:text-6xl font-black text-foreground/90 tracking-tight text-halo">会社概要</h1>
  </div>
</section>
