<!--
  パーツ名: home / 01-hero-slideshow
  元: Home.tsx 内 "Hero（スライドショー）" section
  画像は5枚を5秒ごとに自動切替。下部のドットで手動切替も可能。
  依存: common/irohagumi.css。JSはこのパーツには含めず、common/site.jsに統合済み
        （ポケカン2のパーツエディタに<script>を含めると保存時に壊れる不具合が
        あったため。詳細はsite.js冒頭のコメント参照）。

  ★構造について（2026-09-12修正）
    2段のdiv構成にしています:
      外側 <div> … id・class無し。ポケカン2がパーツを「認識」した際に、ルート要素の
                   class属性を自前のトラッキングクラス（cms-content-parts-sin...）で
                   "追記ではなく丸ごと上書き"してしまう不具合を実機のDevToolsで確認したため、
                   この上書きの影響を受けても実害がない捨て要素として外側に置いています。
      内側 <div id="ig-hero" class="relative h-screen min-h-[640px] overflow-hidden bg-zinc-900">
                 … 実際のレイアウト・高さ指定はすべてこちら。ルートではないためCMSに
                   書き換えられません。

    ・試行錯誤の記録: 以前は「<section>を<div>に変えるだけ」のシンプルな1段構成が
      安定していましたが、その後の実機確認で、貼り付け方によってはCMSがルート要素の
      classを上書きし、h-screen/min-h-[640px]/relative等が消えてheroの高さが0に潰れ、
      absolute配置の画像も表示位置がおかしくなる不具合が再発することが分かりました。
      （それ以前に試した「display:contents」「absolute inset-0」「高さのインラインstyle化」
      は今回の問題とは無関係かつ不要と分かっているため、それらには戻していません。）
    1ページに複数パーツを並べる場合、id="ig-hero"等が重複しないよう他パーツと
    名前が被らないか確認してください。
-->
